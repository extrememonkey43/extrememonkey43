name: Sedef

on:
  push:
    paths:
      - "Sedef/**"
      - ".github/workflows/sedef.yml"
  workflow_dispatch:

jobs:
  script-tests:
    name: Injected script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test Sedef/tests/*.test.mjs

  ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      # The project is committed; generate it only if it's missing.
      - name: Generate Xcode project if missing
        working-directory: Sedef/Xcode
        run: |
          if [ ! -d Sedef.xcodeproj ]; then
            brew install xcodegen
            xcodegen generate
          fi

      - name: Build
        working-directory: Sedef/Xcode
        run: |
          set -o pipefail
          xcodebuild \
            -project Sedef.xcodeproj \
            -scheme Sedef \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log
          echo "Swift warnings:"
          grep -E "\.swift:[0-9]+:[0-9]+: warning" build.log | sort -u || true

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir Payload
          cp -R "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Sedef.app" Payload/
          zip -qry Sedef.ipa Payload
          ls -lh Sedef.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Sedef-ipa
          path: Sedef.ipa
          if-no-files-found: error

      # Ready-to-open Xcode project (project + shared sources + assets).
      - name: Package Xcode project
        run: |
          rm -rf Sedef/Xcode/build.log
          zip -qry Sedef-Xcode.zip Sedef -x "Sedef/tests/*"
          ls -lh Sedef-Xcode.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Sedef-Xcode
          path: Sedef-Xcode.zip
          if-no-files-found: error

      # Informational: checks that the Swift Playgrounds package itself builds.
      - name: Build Swift Playgrounds package
        continue-on-error: true
        working-directory: Sedef/Sedef.swiftpm
        run: |
          set -o pipefail
          xcodebuild -scheme Sedef -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/swiftpm" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 5

# XcodeGen spec. The generated Sedef.xcodeproj is committed, so Xcode users don't need XcodeGen;
# after changing this file run `xcodegen generate` in this folder and commit the result.
# The Swift sources are shared with the Swift Playgrounds package in ../Sedef.swiftpm.
name: Sedef
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Sedef:
    type: application
    platform: iOS
    sources:
      - path: ../Sedef.swiftpm/App
      - path: Assets.xcassets
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Sedef
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        # Free Apple IDs need a bundle identifier nobody else has registered; change it if
        # Xcode reports a conflict.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.extrememonkey43.sedef
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  Sedef:
    build:
      targets:
        Sedef: all
    run:
      config: Debug
    archive:
      config: Release
